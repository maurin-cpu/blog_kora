media: public/uploads

content:
  - name: posts
    label: Blog-Beiträge
    type: collection
    path: content/posts
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titel
        type: string
      - name: date
        label: Datum
        type: date
      - name: author
        label: Autor
        type: string
      - name: excerpt
        label: Auszug
        type: text
      - name: body
        label: Inhalt
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: home
    label: Startseite
    type: file
    path: content/pages/home.md
    format: yaml-frontmatter
    fields:
      - name: heroTitle
        label: Hero-Titel
        type: string
      - name: heroSubtitle
        label: Hero-Untertitel
        type: string
      - name: heroDescription
        label: Hero-Beschreibung
        type: text
      - name: heroImage
        label: Hero-Bild (URL)
        type: string
      - name: postsSectionTitle
        label: Überschrift „Aktuelle Beiträge"
        type: string
