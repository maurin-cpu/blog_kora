media: public/uploads

content:
  - name: posts
    label: Blog-Beiträge
    type: collection
    path: content/posts
    filename: "{fields.title | slugify}.md"
    view:
      fields: [title, date, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: Autor
        type: string
        required: true
        default: Kora Schild
      - name: excerpt
        label: Auszug
        type: text
        description: Kurze Zusammenfassung für die Übersichtsseite.
      - name: body
        label: Inhalt
        type: rich-text
        options:
          format: markdown
